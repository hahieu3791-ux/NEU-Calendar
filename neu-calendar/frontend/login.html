<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập – NEU Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="justify-content: center; align-items: center; background: radial-gradient(circle at top right, #EEF2FF 0%, #F8FAFC 60%);">
  <div style="width: 100%; max-width: 440px; padding: 20px;">
    <!-- Brand Box -->
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="width: 48px; height: 48px; background: linear-gradient(135deg, #0F2A4A 0%, #1D4ED8 100%); border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; color: #FFFFFF; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(29, 78, 216, 0.2);">
        <i data-lucide="calendar-check" style="width: 26px; height: 26px;"></i>
      </div>
      <h1 style="font-size: 22px; font-weight: 800; color: var(--primary-navy); margin-bottom: 4px;">NEU Calendar</h1>
      <p style="font-size: 13.5px; color: var(--text-muted);">Smart Academic Planner – ĐH Kinh tế Quốc dân</p>
    </div>

    <!-- Login Card -->
    <div class="card" style="box-shadow: var(--shadow-lg); border-radius: var(--radius-lg); padding: 32px 28px;">
      <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 6px;">Đăng nhập tài khoản</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 24px;">Nhập email sinh viên để truy cập lịch học và deadline</p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email sinh viên NEU</label>
          <input type="email" id="email" class="form-input" placeholder="ten.mssv@neu.edu.vn" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 11px; margin-top: 8px; font-size: 14px;">
          <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
          <span>Đăng nhập</span>
        </button>
      </form>

      <div style="position: relative; text-align: center; margin: 24px 0;">
        <hr style="border: 0; border-top: 1px solid var(--border-color);" />
        <span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #FFFFFF; padding: 0 10px; font-size: 11.5px; color: var(--text-light); text-transform: uppercase;">hoặc</span>
      </div>

      <!-- Quick Demo Account Button -->
      <button type="button" id="demo-btn" class="btn btn-outline" style="width: 100%; padding: 10px; font-size: 13px; border-style: dashed; border-color: #93C5FD; color: var(--primary-blue); background-color: #F8FAFC;">
        <i data-lucide="sparkles" style="width: 16px; height: 16px;"></i>
        <span>Đăng nhập nhanh tài khoản Demo (K64 NEU)</span>
      </button>

      <p style="text-align: center; font-size: 13px; color: var(--text-muted); margin-top: 24px;">
        Chưa có tài khoản? <a href="register.html" style="color: var(--primary-blue); font-weight: 600;">Đăng ký ngay</a>
      </p>
    </div>
  </div>

  <div id="toast-container"></div>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
